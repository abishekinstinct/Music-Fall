<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#090712">
    <meta name="description" content="VibeMusic - Your personal music player">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <title>VibeMusic</title>
</head>

<body>

<div class="app">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">♫</div>
            <span>VibeMusic</span>
        </div>

        <nav class="main-nav">

            <button class="nav-btn active" data-page="home">
                <span class="nav-icon">⌂</span>
                <span>Home</span>
            </button>

            <button class="nav-btn" data-page="library">
                <span class="nav-icon">♫</span>
                <span>Your Library</span>
            </button>

            <button class="nav-btn" data-page="liked">
                <span class="nav-icon heart-icon">♥</span>
                <span>Favorites</span>
            </button>

            <button class="nav-btn" data-page="recent">
                <span class="nav-icon">◷</span>
                <span>Recently Played</span>
            </button>

        </nav>


        <div class="sidebar-section">

            <div class="sidebar-title">
                <span>PLAYLISTS</span>

                <button
                    id="createPlaylist"
                    class="add-playlist-btn"
                    title="Create playlist">
                    +
                </button>
            </div>

            <div id="playlistList"></div>

        </div>


        <div class="sidebar-bottom">

            <button
                id="installButton"
                class="install-btn hidden">
                <span>📱</span>
                Install App
            </button>

            <small>
                VibeMusic Player
            </small>

        </div>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="main">

        <header class="topbar">

            <div class="mobile-logo">
                <span>♫</span>
                VibeMusic
            </div>

            <div class="search-box">

                <span class="search-icon">⌕</span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search songs, artists..."
                    autocomplete="off">

                <button
                    id="clearSearch"
                    class="clear-search">
                    ×
                </button>

            </div>

            <button
                class="add-song-btn"
                id="addSongButton">

                <span>＋</span>
                Add Songs

            </button>

        </header>


        <section id="content"></section>

    </main>

</div>


<!-- ================= MUSIC PLAYER ================= -->

<footer class="music-player">

    <!-- CURRENT SONG -->

    <div class="current-song">

        <div
            id="playerCover"
            class="player-cover">

            <span>♫</span>

        </div>


        <div class="current-info">

            <strong id="playerTitle">
                Nothing Playing
            </strong>

            <span id="playerArtist">
                Select a song
            </span>

        </div>


        <button
            id="likeButton"
            class="heart-btn"
            title="Add to favorites">

            ♡

        </button>

    </div>


    <!-- PLAYER CENTER -->

    <div class="player-center">

        <div class="controls">

            <button
                id="shuffleButton"
                class="control-btn"
                title="Shuffle">

                🔀

            </button>


            <button
                id="previousButton"
                class="control-btn"
                title="Previous">

                ⏮

            </button>


            <button
                id="playButton"
                class="play-button"
                title="Play">

                ▶

            </button>


            <button
                id="nextButton"
                class="control-btn"
                title="Next">

                ⏭

            </button>


            <button
                id="repeatButton"
                class="control-btn"
                title="Repeat">

                🔁

            </button>

        </div>


        <div class="progress-container">

            <span id="currentTime">
                0:00
            </span>


            <input
                type="range"
                id="progressBar"
                min="0"
                max="100"
                value="0"
                step="0.1">


            <span id="duration">
                0:00
            </span>

        </div>

    </div>


    <!-- VOLUME -->

    <div class="volume-control">

        <button
            id="muteButton"
            title="Mute">

            🔊

        </button>


        <input
            type="range"
            id="volumeSlider"
            min="0"
            max="1"
            step="0.01"
            value="0.8">

    </div>

</footer>


<!-- AUDIO -->

<audio
    id="audioPlayer"
    preload="metadata">
</audio>


<!-- ================= ADD SONG DIALOG ================= -->

<dialog id="addSongDialog">

    <form
        method="dialog"
        id="addSongForm">

        <h2>Add Songs</h2>

        <p class="dialog-description">
            Select one or more music files.
        </p>

        <label class="upload-area">

            <input
                type="file"
                id="songFiles"
                accept="audio/*"
                multiple>

            <div class="upload-icon">
                🎵
            </div>

            <strong>
                Choose music files
            </strong>

            <small>
                MP3, M4A, WAV, OGG
            </small>

        </label>


        <div id="selectedFiles"></div>


        <div class="dialog-buttons">

            <button value="cancel">
                Cancel
            </button>

            <button
                id="saveSongs"
                class="primary-btn"
                value="default"
                disabled>

                Add Songs

            </button>

        </div>

    </form>

</dialog>


<!-- ================= PLAYLIST DIALOG ================= -->

<!-- ================= PLAYLIST DIALOG ================= -->

<dialog id="playlistDialog">

    <form id="playlistForm">

        <div class="playlist-dialog-header">

            <div>
                <h2>Create Playlist</h2>

                <p>
                    Choose songs from your VibeMusic library.
                </p>
            </div>

            <button
                type="button"
                id="closePlaylistDialog"
                class="dialog-close">
                ×
            </button>

        </div>


        <input
            id="playlistName"
            type="text"
            placeholder="Playlist name..."
            maxlength="50"
            required>


        <div class="playlist-song-header">

            <strong>
                Select Songs
            </strong>

            <span id="selectedSongCount">
                0 selected
            </span>

        </div>


        <div
            id="playlistSongSelector"
            class="playlist-song-selector">
        </div>


        <div class="dialog-buttons">

            <button
                type="button"
                id="cancelPlaylist"
                class="secondary-btn">

                Cancel

            </button>

            <button
                type="submit"
                class="primary-btn">

                Create Playlist

            </button>

        </div>

    </form>

</dialog>
<div id="toast"></div>


<script src="app.js"></script>


<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("service-worker.js")
            .catch(error => {
                console.log("Service worker error:", error);
            });

    });

}

</script>

</body>
</html>
